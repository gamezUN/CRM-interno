<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0f">
  <meta name="description" content="CRM interno de Gámez Desarrollo Web para gestionar clientes, proyectos, seguimiento y finanzas.">
  <title>Gámez Desarrollo Web · CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="side">
    <div class="brand"><b>GÁMEZ DESARROLLO WEB</b><small>FREELANCE DEVELOPER</small></div>
    <nav id="nav" aria-label="Navegación principal"></nav>
  </aside>
  <main>
    <header>
      <button id="burger" aria-label="Abrir menú" aria-controls="side">☰</button>
      <h1 id="title">Panel general</h1>
      <div class="head-actions"><button class="btn g" data-a="logout" id="logout" hidden>Cerrar sesión</button><button class="btn" data-a="nuevo">+ Nuevo proyecto</button></div>
    </header>
    <div id="app" aria-live="polite"></div>
  </main>
  <dialog id="dlg" aria-label="Formulario"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="assistant.js"></script>
  <script src="app.js"></script>
</body>
</html>
